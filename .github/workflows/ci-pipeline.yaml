name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-code:
    name: Build Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up a fake environment
        run: |
          echo "Setting up a fake environment for testing purposes."
          # Add any setup commands here

      - name: upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-app
          path: app/blue/
          retention-days: 1

  image-scan-push:
    name: Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-code]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: download build
        uses: actions/download-artifact@v4
        with:
          name: build-app
          path: dist/

      - name: verify files
        run: |
          ls -R dist/

  check:
    name: Check for Vulnerabilities
    needs: [build-code]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner in fs mode
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        trivy-config: trivy.yaml