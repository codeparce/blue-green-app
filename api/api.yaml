apiVersion: v1
kind: Namespace
metadata:
  name: api
  labels:
    name: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-green-api-deployment
  namespace: api
  labels:
    name: blue-green-api
  # Buenas practicas
  annotations:
    kubernetes.io/change-cause: "Aqui va la razon por la cual se hizo el cambio"
spec:
  selector:
    matchLabels:
      app: blue-green-api
  template:
    metadata:
      labels:
        app: blue-green-api
    spec:
      containers:
        - name: blue-green-api
          image: codeparce/blue-green-app:api
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # limitar recursos para cada pod
          resources:
            requests:
              cpu: "100m"
              memory: "150Mi"
            limits:
              cpu: "200m"
              memory: "250Mi"
          # Verficiar el servicio
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 3000
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          #   timeoutSeconds: 2
          #   failureThreshold: 3
          # # Listo para recibir trafico
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 3000
          #   initialDelaySeconds: 5
          #   periodSeconds: 5
          #   timeoutSeconds: 2
          #   failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: blue-green-api-svc
  namespace: api
  labels:
    name: blue-green-api
spec:
  selector:
    app: blue-green-api
  ports:
    - name: http     
      port: 80
      targetPort: 3000

  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "blue-green-api-ingress" 
  namespace: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`blue-green-api.lab`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      kind: Rule
      services:
        - name: blue-green-api-svc
          port: 80
  # tls:
  #   domains:
  #   - main: blue-green-api.lab
  #   secretName: blue-green-app-tls