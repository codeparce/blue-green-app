services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bluegreen
      POSTGRES_USER: bluegreen
      POSTGRES_PASSWORD: bluegreen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres-data:
